name: Validation des données publiques
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.0'
          use-public-rspm: true
      - name: Installer les bibliothèques système des lecteurs
        run: sudo apt-get update && sudo apt-get install -y libudunits2-dev libgdal-dev libgeos-dev libproj-dev libcurl4-openssl-dev libssl-dev libxml2-dev
      - uses: r-lib/actions/setup-renv@v2
      - name: Vérifier les tables, la confidentialité et les fixtures
        run: make test
